server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: menta-finance-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/menta_finance}
    username: ${DB_USERNAME:menta_finance_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:lNlHA/+NfW+uw1lYUYauLmoEU0PK6PZ4WBIy+DFLXBZhMElaFCzWeIuDqN/K3OAp}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}